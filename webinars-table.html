<style>
#miam-webinars {
    --blue:   #062b66;
    --blue2:  #0a3f8a;
    --light:  #f4f8fd;
    --line:   #dbe5f1;
    --text:   #12223a;
    --muted:  #5f6f86;
    --red:    #c91f2d;
    --green:  #0f7a3e;
    --shadow: 0 10px 28px rgba(6,43,102,.12);
    --radius: 14px;

    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    color: var(--text);
    line-height: 1.45;
    box-sizing: border-box;
}

#miam-webinars *, #miam-webinars *::before, #miam-webinars *::after {
    box-sizing: border-box;
}

#miam-webinars a {
    color: var(--blue2);
    text-decoration: none;
}

#miam-webinars a:hover {
    text-decoration: underline;
}

/* Search bar */
#miam-webinars .mw-search-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
}

#miam-webinars .mw-search-input {
    flex: 1;
    min-width: 200px;
    padding: .6rem .85rem;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: .97rem;
    font-family: inherit;
    color: var(--text);
    background: #fff;
    transition: border-color .15s;
}

#miam-webinars .mw-search-input:focus {
    outline: none;
    border-color: var(--blue2);
    box-shadow: 0 0 0 3px rgba(10,63,138,.12);
}

#miam-webinars .mw-count {
    font-size: .88rem;
    color: var(--muted);
    white-space: nowrap;
}

/* Table wrapper */
#miam-webinars .mw-table-wrap {
    width: 100%;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
}

#miam-webinars table {
    width: 100%;
    border-collapse: collapse;
    font-size: .92rem;
    min-width: 700px;
}

#miam-webinars thead tr {
    background: var(--blue);
    color: #fff;
}

#miam-webinars thead th {
    padding: 11px 14px;
    text-align: left;
    font-weight: 700;
    font-size: .82rem;
    letter-spacing: .04em;
    text-transform: uppercase;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
}

#miam-webinars thead th:hover {
    background: var(--blue2);
}

#miam-webinars thead th .mw-sort-icon {
    display: inline-block;
    margin-left: 5px;
    opacity: .55;
    font-style: normal;
}

#miam-webinars thead th.sorted-asc .mw-sort-icon::after  { content: ' \25B2'; opacity: 1; }
#miam-webinars thead th.sorted-desc .mw-sort-icon::after { content: ' \25BC'; opacity: 1; }
#miam-webinars thead th:not(.sorted-asc):not(.sorted-desc) .mw-sort-icon::after { content: ' \25B2\25BC'; }

#miam-webinars tbody tr {
    border-bottom: 1px solid var(--line);
    transition: background .1s;
}

#miam-webinars tbody tr:last-child {
    border-bottom: 0;
}

#miam-webinars tbody tr:nth-child(even) {
    background: var(--light);
}

#miam-webinars tbody tr:hover {
    background: #e4edf9;
}

#miam-webinars td {
    padding: 10px 14px;
    vertical-align: top;
}

/* Column widths */
#miam-webinars .col-title    { min-width: 220px; }
#miam-webinars .col-approval { width: 130px; white-space: nowrap; }
#miam-webinars .col-credits  { width: 190px; }
#miam-webinars .col-expires  { width: 110px; white-space: nowrap; }
#miam-webinars .col-links    { width: 90px;  white-space: nowrap; }

/* Approval badge */
#miam-webinars .mw-approval {
    display: inline-block;
    font-family: monospace;
    font-size: .82rem;
    background: var(--light);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 2px 7px;
    color: var(--blue);
    font-weight: 700;
}

/* Credit tags */
#miam-webinars .mw-credit-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
}

#miam-webinars .mw-tag {
    display: inline-block;
    font-size: .76rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 5px;
    letter-spacing: .03em;
}

#miam-webinars .mw-tag.t  { background: #e0ecff; color: #062b66; }
#miam-webinars .mw-tag.pr { background: #f0e0ff; color: #4a1a8a; }
#miam-webinars .mw-tag.ra { background: #fff0e0; color: #7a3a00; }
#miam-webinars .mw-tag.sp { background: #e0fff0; color: #0a4a28; }
#miam-webinars .mw-tag.n  { background: var(--light); color: var(--muted); }

/* Link buttons */
#miam-webinars .mw-link-row {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

#miam-webinars .mw-pdf-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: .82rem;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 7px;
    border: 1px solid;
    white-space: nowrap;
    transition: .12s ease;
}

#miam-webinars .mw-pdf-btn.quiz {
    border-color: var(--blue2);
    color: var(--blue2);
    background: #fff;
}

#miam-webinars .mw-pdf-btn.answers {
    border-color: var(--green);
    color: var(--green);
    background: #fff;
}

#miam-webinars .mw-pdf-btn.watch {
    border-color: #c00;
    color: #c00;
    background: #fff;
}

#miam-webinars .mw-pdf-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 3px 8px rgba(0,0,0,.12);
    text-decoration: none;
}

/* Expiry warning */
#miam-webinars .mw-exp-soon {
    color: var(--red);
    font-weight: 700;
}

/* No results */
#miam-webinars .mw-no-results {
    text-align: center;
    padding: 32px;
    color: var(--muted);
    font-size: .97rem;
}

/* Legend */
#miam-webinars .mw-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    margin-top: 12px;
    font-size: .82rem;
    color: var(--muted);
}

#miam-webinars .mw-legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
}
</style>

        quiz:     "https://www.mechanicalinspector.com/uploads/7/2/4/8/72481723/cp-25-00007_quiz_-_a2l___b-y.pdf",
        answers:  "https://www.mechanicalinspector.com/uploads/7/2/4/8/72481723/cp-25-00007_answers_-_a2l___b-y.pdf",
        video:    "https://youtu.be/a1FISwa7fGg"
    }
];

var mwSortCol   = -1;
var mwSortDir   = 1;
var mwFiltered  = MW_DATA.slice();

function mwCreditHTML(row) {
    var html = '<div class="mw-credit-tags">';
    row.credits.forEach(function(c) {
        var qty = c.qty > 1 ? c.qty + ' ' : '';
        html += '<span class="mw-tag ' + c.type + '">' + qty + c.label + '</span>';
    });
    html += '</div>';
    html += '<div style="font-size:.8rem;color:var(--muted);margin-top:3px;">';
    html += row.total + ' credit' + (row.total !== 1 ? 's' : '') + ' &mdash; ' + row.audience;
    html += '</div>';
    return html;
}

function mwExpireHTML(row) {
    var soon = row.expDate <= new Date("2026-12-31");
    var cls  = soon ? ' class="mw-exp-soon"' : '';
    return '<span' + cls + '>' + row.expires + '</span>';
}

function mwLinksHTML(row) {
    return '<div class="mw-link-row">'
        + '<a class="mw-pdf-btn quiz"    href="' + row.quiz    + '" target="_blank" rel="noopener">&#128196; Quiz</a>'
        + '<a class="mw-pdf-btn answers" href="' + row.answers + '" target="_blank" rel="noopener">&#10003; Answers</a>'
        + '</div>';
}

function mwTitleHTML(row) {
    return row.title
        + '<div style="margin-top:6px;">'
        + '<a class="mw-pdf-btn watch" href="' + row.video + '" target="_blank" rel="noopener">&#9654; Watch</a>'
        + '</div>';
}

function mwRender() {
    var tbody = document.getElementById('mw-tbody');
    var count = document.getElementById('mw-count');
    if (!mwFiltered.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="mw-no-results">No webinars match your search.</td></tr>';
        count.textContent = '0 of ' + MW_DATA.length + ' webinars';
        return;
    }
    var rows = '';
    mwFiltered.forEach(function(r) {
        rows += '<tr>'
            + '<td class="col-title">'    + mwTitleHTML(r) + '</td>'
            + '<td class="col-approval"><span class="mw-approval">' + r.approval + '</span></td>'
            + '<td class="col-credits">'  + mwCreditHTML(r) + '</td>'
            + '<td class="col-expires">'  + mwExpireHTML(r) + '</td>'
            + '<td class="col-links">'    + mwLinksHTML(r)  + '</td>'
            + '</tr>';
    });
    tbody.innerHTML = rows;
    count.textContent = mwFiltered.length + ' of ' + MW_DATA.length + ' webinars';
}

function mwFilter() {
    var q = document.getElementById('mw-search').value.toLowerCase().trim();
    if (!q) {
        mwFiltered = MW_DATA.slice();
    } else {
        mwFiltered = MW_DATA.filter(function(r) {
            var haystack = [
                r.title,
                r.approval,
                r.audience,
                r.credits.map(function(c){ return c.label; }).join(' ')
            ].join(' ').toLowerCase();
            return haystack.indexOf(q) !== -1;
        });
    }
    // re-apply current sort
    if (mwSortCol >= 0) mwApplySort();
    mwRender();
}

function mwSort(col) {
    var ths = document.querySelectorAll('#miam-webinars thead th');
    if (mwSortCol === col) {
        mwSortDir = -mwSortDir;
    } else {
        mwSortCol = col;
        mwSortDir = 1;
    }
    ths.forEach(function(th, i) {
        th.classList.remove('sorted-asc', 'sorted-desc');
        if (i === col) th.classList.add(mwSortDir === 1 ? 'sorted-asc' : 'sorted-desc');
    });
    mwApplySort();
    mwRender();
}

function mwApplySort() {
    var keys = ['title', 'approval', null, 'expires'];
    mwFiltered.sort(function(a, b) {
        var av, bv;
        if (mwSortCol === 2) {
            av = a.total; bv = b.total;
        } else if (mwSortCol === 3) {
            av = a.expDate; bv = b.expDate;
        } else {
            av = (a[keys[mwSortCol]] || '').toLowerCase();
            bv = (b[keys[mwSortCol]] || '').toLowerCase();
        }
        if (av < bv) return -mwSortDir;
        if (av > bv) return  mwSortDir;
        return 0;
    });
}

// Initial render
mwFilter();
</script>
